# Tests, lints and formatting on every push and pull request.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests
        shell: pwsh
        working-directory: rust
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "Run cargo fmt." }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy found problems." }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw "The tests failed." }
