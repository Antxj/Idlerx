# Opens pull requests when the pinned GitHub Actions or the Rust dependencies
# have new versions (security fixes included). Nothing is merged by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # windows and windows-core must stay on the version webview2-com uses
      # (they are updated by hand together with it)
      - dependency-name: "windows"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # minor and patch updates together in one pull request
      rust:
        update-types: [minor, patch]
