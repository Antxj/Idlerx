[package]
name = "idlerx"
version = "0.6.0"
edition = "2021"
description = "Several isolated browser sessions (accounts) side by side in a single window"
license = "GPL-3.0-or-later"
repository = "https://github.com/Antxj/Idlerx"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu_no_default_features", "default_fonts"] }
# only the DirectX 12 backend: no Vulkan/OpenGL code in the executable
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
windows-core = "0.62"
raw-window-handle = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
getrandom = "0.4"
# VPN per group: sockets pinned to the VPN adapter, TOTP tokens, file picker
socket2 = "0.6"
hmac = "0.13"
sha1 = "0.11"
base32 = "0.5"
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Threading", "Win32_Globalization", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_NetManagement"] }
tray-icon = "0.26"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
